# Reads your ISBN list on myidentifiers.com every day and fills new ISBNs into Supabase.
# Run it by hand: GitHub > catalog-editor > Actions > Bowker ISBNs > Run workflow.
name: Bowker ISBNs
on:
  schedule:
    - cron: "17 10 * * *"   # every day at 10:17 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-bowker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install the browser
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Read Bowker and update Supabase
        run: node scripts/bowker-isbns.mjs
        env:
          BOWKER_EMAIL: ${{ secrets.BOWKER_EMAIL }}
          BOWKER_PASSWORD: ${{ secrets.BOWKER_PASSWORD }}
          BOWKER_SYNC_TOKEN: ${{ secrets.BOWKER_SYNC_TOKEN }}
          BOWKER_LOGIN_URL: ${{ vars.BOWKER_LOGIN_URL }}
          BOWKER_LIST_URL: ${{ vars.BOWKER_LIST_URL }}
